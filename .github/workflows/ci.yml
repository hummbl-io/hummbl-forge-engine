name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy rustfmt
          rustup default stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  cross-compile-windows:
    name: Cross-compile (Windows)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust Windows target
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
          rustup default stable

      - name: Install mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Cross-compile forge-cli for Windows
        run: cargo build --target x86_64-pc-windows-gnu -p forge-cli --no-default-features

  build-cli:
    name: Build CLI (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: forge-linux-x86_64
          - os: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: forge-windows-x86_64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "${TARGET}"
          rustup default stable
        env:
          TARGET: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --target "${TARGET}" -p forge-cli
        env:
          TARGET: ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          EXT=""
          if [ "${MATRIX_OS}" = "windows" ]; then
            EXT=".exe"
          fi
          cp "target/${TARGET}/release/forge${EXT}" "${ARTIFACT}"
        env:
          MATRIX_OS: ${{ matrix.os }}
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Release
    needs: [test, build-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        run: gh release create "${TAG_NAME}" artifacts/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
